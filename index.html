function b64ToBuf(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf;
}

async function deriveKey(password, saltB64, iterations) {
  const enc = new TextEncoder();
  const salt = b64ToBuf(saltB64);
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function tryDecrypt(password) {
  const key = await deriveKey(password, ENC.salt, ENC.iterations);
  const iv = b64ToBuf(ENC.iv);
  const ciphertext = b64ToBuf(ENC.ciphertext);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
  return new TextDecoder().decode(plainBuf);
}

function showLoginError(msg) {
  const errEl = document.getElementById("login-err");
  const pwInput = document.getElementById("pw-input");
  errEl.textContent = msg;
  errEl.style.display = "block";
  pwInput.classList.add("err");
  pwInput.value = "";
  pwInput.focus();
}

async function handleLogin() {
  const btn = document.getElementById("login-btn");
  const pwInput = document.getElementById("pw-input");
  const errEl = document.getElementById("login-err");
  const pw = pwInput.value;
  if (!pw) return;
  errEl.style.display = "none";
  pwInput.classList.remove("err");
  btn.disabled = true;
  btn.textContent = "...";
  let code;
  try {
    code = await tryDecrypt(pw);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Log in";
    showLoginError("Incorrect password. Please try again.");
    return;
  }
  try {
    const transformed = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("root").style.display = "block";
    (0, eval)(transformed);
  } catch (e) {
    console.error("App init failed:", e);
    btn.disabled = false;
    btn.textContent = "Log in";
    showLoginError("Error loading the app. Please reload the page.");
  }
}

document.getElementById("login-btn").addEventListener("click", handleLogin);
document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
document.getElementById("pw-input").focus();
</script>
